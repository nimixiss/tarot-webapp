name: Visual QA — Uzел+ v2
on:
  pull_request:
    paths:
      - 'index.html'
      - 'uzel-plus.js'
      - 'uzel-plus.css'
      - 'uzel-v2.css'
      - 'assets/**'
      - 'scripts/verify-uzel-v2.cjs'
      - '.github/workflows/visual-uzel-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render and check Mini App at mobile widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mystic-server.log 2>&1 &
          node scripts/verify-uzel-v2.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uzel-v2-mobile-screenshots
          path: ui-preview/
          if-no-files-found: warn
