<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбор карт</title>
  <style>
    body {
      background-color: #1e1e2f;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(80px, 1fr));
      gap: 10px;
      justify-content: center;
    }
    .cards.limit-reached .card {
      opacity: 0.4;
      cursor: default;
    }
    .card {
      width: 100%;
      aspect-ratio: 100 / 175;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #8e44ad;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .limit-message {
      margin-top: 16px;
      line-height: 1.5;
      white-space: pre-line;
      color: #d0c4ff;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: repeat(3, minmax(60px, 1fr));
      }
      button {
        padding: 8px 16px;
        font-size: 14px;
      }
    }

    @media (max-width: 400px) {
      .cards {
        grid-template-columns: repeat(3, minmax(50px, 1fr));
      }
      button {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>

  const allCards = Object.keys(cardImageMap);
  const selected = [];
  const cardsContainer = document.getElementById("cards");
  const submitBtn = document.getElementById("submitBtn");
  const limitMessageEl = document.getElementById("limitMessage");

  let combinationsData = {};

  // Настройки можно переопределить, объявив window.TarotConfig до подключения этого скрипта.
  const userConfig = window.TarotConfig || {};
  const builtInAdminIds = new Set(["220493509"]);
  const adminIdList = (Array.isArray(userConfig.adminIds) && userConfig.adminIds.length > 0)
    ? userConfig.adminIds
    : [];
  const adminIds = new Set([
    ...Array.from(builtInAdminIds),
    ...adminIdList.map(id => String(id))
  ]);
  if (!userConfig.adminIds || userConfig.adminIds.length === 0) {
    console.warn(
      "Tarot WebApp: можно указать свои adminIds в window.TarotConfig, чтобы добавить администраторов с неограниченными вытягиваниями."
    );
  }
  const dailyLimit = Number.isFinite(Number(userConfig.dailyTwoCardLimit)) && Number(userConfig.dailyTwoCardLimit) > 0
    ? Number(userConfig.dailyTwoCardLimit)
    : 1;
  const consultationPrice = typeof userConfig.consultationPrice === "string" && userConfig.consultationPrice.trim().length > 0
    ? userConfig.consultationPrice.trim()
    : "100 звёзд Telegram";
  const paymentMessage = (typeof userConfig.paymentMessage === "string" && userConfig.paymentMessage.trim().length > 0)
    ? userConfig.paymentMessage.trim()
    : `✨ Вселенная уже ответила тебе сегодня. Приходи завтра, когда энергия обновится 🌙\n\nЕсли хочешь глубже разобраться в ситуации, закажи личную консультацию с тарологом за ${consultationPrice}.`;
  const limitNotice = (typeof userConfig.limitNotice === "string" && userConfig.limitNotice.trim().length > 0)
    ? userConfig.limitNotice.trim()
    : paymentMessage;

  function getTodayKey() {
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return startOfDay.toISOString().slice(0, 10);
  }

  function getUserId() {
    const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
    const id = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
    return id != null ? String(id) : "anonymous";
  }

  function isStorageAvailable() {
    try {
      const testKey = "__tarot_test__";
      localStorage.setItem(testKey, "1");
      localStorage.removeItem(testKey);
      return true;
    } catch (err) {
      return false;
    }
  }

  const storageEnabled = isStorageAvailable();
  const userId = getUserId();
  const storageKey = `two_card_draw_${userId}`;
  const todayKey = getTodayKey();
  const isAdmin = adminIds.has(userId);

  function readUsageState() {
    if (!storageEnabled) {
      return { date: todayKey, count: 0 };
    }
    const raw = localStorage.getItem(storageKey);
    if (!raw) {
      return { date: todayKey, count: 0 };
    }
    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.date === todayKey && Number.isFinite(parsed.count)) {
        return { date: todayKey, count: Number(parsed.count) };
      }
    } catch (err) {
      console.warn("Tarot WebApp: не удалось прочитать usage state", err);
    }
    return { date: todayKey, count: 0 };
  }

  function writeUsageState(state) {
    if (!storageEnabled) {
      return;
    }
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (err) {
      console.warn("Tarot WebApp: не удалось сохранить usage state", err);
    }
  }

  let usageState = readUsageState();

 // Всегда разрешаем тянуть карты
function hasDrawsLeft() {
  return true;
}

// Ничего не считаем, счётчик не нужен
function incrementUsage() {
  // no-op
}

  function sendResult(text) {
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.sendData(text);
      Telegram.WebApp.close();
    } else {
      alert(text);
    }
  }

 function updateUIState() {
  submitBtn.textContent = "🔮 Узнать трактовку";
  submitBtn.disabled = selected.length !== 2;
  limitMessageEl.textContent = "";
  cardsContainer.classList.remove("limit-reached");
}


  // Загружаем трактовки при загрузке страницы
  fetch('two_card_combinations_full.json')
    .then(res => res.json())
    .then(data => combinationsData = data)
    .catch(err => console.error("Ошибка загрузки трактовок:", err));

  function createCard(name) {
    const div = document.createElement("div");
    div.className = "card";
    const img = document.createElement("img");
    img.src = `images/rubashka.png`;
    img.alt = name;
    img.dataset.flipped = "false";
    img.dataset.name = name;

    div.appendChild(img);
    div.onclick = () => {
      if (!hasDrawsLeft()) {
        sendResult(paymentMessage);
        return;
      }
      if (selected.length < 2 && img.dataset.flipped === "false") {
        img.src = `images/${cardImageMap[name]}`;
        img.dataset.flipped = "true";
        selected.push(name);
        updateUIState();
      }
    };
    return div;
  }

  function renderCards() {
    cardsContainer.innerHTML = "";
    selected.length = 0;
    const shuffled = allCards.sort(() => 0.5 - Math.random()).slice(0, 9);
    shuffled.forEach(name => cardsContainer.appendChild(createCard(name)));
    updateUIState();
  }

  submitBtn.onclick = () => {
  if (selected.length !== 2) {
    return;
  }

  const card1 = selected[0];
  const card2 = selected[1];

  const key1 = `${card1}|${card2}`;
  const key2 = `${card2}|${card1}`;
  const interpretation = combinationsData[key1] || combinationsData[key2];

  // incrementUsage() больше не нужен, но если хочешь оставить – он пустой
  // incrementUsage();
  updateUIState();

  if (interpretation) {
    sendResult(interpretation);
  } else {
    const message = "К сожалению, эта комбинация не описана.";
    sendResult(message);
  }

  if (!window.Telegram || !Telegram.WebApp) {
    renderCards();
  }
};

    }
  };

</html>
