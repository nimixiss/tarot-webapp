<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбор карт</title>
  <style>
    body {
      background-color: #1e1e2f;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(80px, 1fr));
      gap: 10px;
      justify-content: center;
    }
    .cards.limit-reached .card {
      opacity: 0.4;
      cursor: default;
    }
    .card {
      width: 100%;
      aspect-ratio: 100 / 175;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #8e44ad;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .limit-message {
      margin-top: 16px;
      line-height: 1.5;
      white-space: pre-line;
      color: #d0c4ff;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: repeat(3, minmax(60px, 1fr));
      }
      button {
        padding: 8px 16px;
        font-size: 14px;
      }
    }

    @media (max-width: 400px) {
      .cards {
        grid-template-columns: repeat(3, minmax(50px, 1fr));
      }
      button {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
<h1>✨ Выбери 2 карты</h1>
<div class="cards" id="cards"></div>
<button id="submitBtn" disabled>🔮 Узнать трактовку</button>
<p id="limitMessage" class="limit-message"></p>

<script>
  const cardImageMap = {
    "Шут (0)": "fool.png",
    "Маг (I)": "magician.png",
    "Верховная Жрица (II)": "high_priestess.png",
    "Императрица (III)": "empress.png",
    "Император (IV)": "emperor.png",
    "Иерофант (V)": "hierophant.png",
    "Влюблённые (VI)": "lovers.png",
    "Колесница (VII)": "chariot.png",
    "Сила (VIII)": "strength.png",
    "Отшельник (IX)": "hermit.png",
    "Колесо Фортуны (X)": "wheel_of_fortune.png",
    "Справедливость (XI)": "justice.png",
    "Повешенный (XII)": "hanged_man.png",
    "Смерть (XIII)": "death.png",
    "Умеренность (XIV)": "temperance.png",
    "Дьявол (XV)": "devil.png",
    "Башня (XVI)": "tower.png",
    "Звезда (XVII)": "star.png",
    "Луна (XVIII)": "moon.png",
    "Солнце (XIX)": "sun.png",
    "Суд (XX)": "judgement.png",
    "Мир (XXI)": "world.png",
    "Туз Кубков": "ace_of_cups.png",
    "Двойка Кубков": "two_of_cups.png",
    "Тройка Кубков": "three_of_cups.png",
    "Четвёрка Кубков": "four_of_cups.png",
    "Пятёрка Кубков": "five_of_cups.png",
    "Шестёрка Кубков": "six_of_cups.png",
    "Семёрка Кубков": "seven_of_cups.png",
    "Восьмёрка Кубков": "eight_of_cups.png",
    "Девятка Кубков": "nine_of_cups.png",
    "Десятка Кубков": "ten_of_cups.png",
    "Паж Кубков": "page_of_cups.png",
    "Рыцарь Кубков": "knight_of_cups.png",
    "Королева Кубков": "queen_of_cups.png",
    "Король Кубков": "king_of_cups.png",
    "Туз Мечей": "ace_of_swords.png",
    "Двойка Мечей": "two_of_swords.png",
    "Тройка Мечей": "three_of_swords.png",
    "Четвёрка Мечей": "four_of_swords.png",
    "Пятёрка Мечей": "five_of_swords.png",
    "Шестёрка Мечей": "six_of_swords.png",
    "Семёрка Мечей": "seven_of_swords.png",
    "Восьмёрка Мечей": "eight_of_swords.png",
    "Девятка Мечей": "nine_of_swords.png",
    "Десятка Мечей": "ten_of_swords.png",
    "Паж Мечей": "page_of_swords.png",
    "Рыцарь Мечей": "knight_of_swords.png",
    "Королева Мечей": "queen_of_swords.png",
    "Король Мечей": "king_of_swords.png",
    "Туз Пентаклей": "ace_of_pentacles.png",
    "Двойка Пентаклей": "two_of_pentacles.png",
    "Тройка Пентаклей": "three_of_pentacles.png",
    "Четвёрка Пентаклей": "four_of_pentacles.png",
    "Пятёрка Пентаклей": "five_of_pentacles.png",
    "Шестёрка Пентаклей": "six_of_pentacles.png",
    "Семёрка Пентаклей": "seven_of_pentacles.png",
    "Восьмёрка Пентаклей": "eight_of_pentacles.png",
    "Девятка Пентаклей": "nine_of_pentacles.png",
    "Десятка Пентаклей": "ten_of_pentacles.png",
    "Паж Пентаклей": "page_of_pentacles.png",
    "Рыцарь Пентаклей": "knight_of_pentacles.png",
    "Королева Пентаклей": "queen_of_pentacles.png",
    "Король Пентаклей": "king_of_pentacles.png",
    "Туз Жезлов": "ace_of_wands.png",
    "Двойка Жезлов": "two_of_wands.png",
    "Тройка Жезлов": "three_of_wands.png",
    "Четвёрка Жезлов": "four_of_wands.png",
    "Пятёрка Жезлов": "five_of_wands.png",
    "Шестёрка Жезлов": "six_of_wands.png",
    "Семёрка Жезлов": "seven_of_wands.png",
    "Восьмёрка Жезлов": "eight_of_wands.png",
    "Девятка Жезлов": "nine_of_wands.png",
    "Десятка Жезлов": "ten_of_wands.png",
    "Паж Жезлов": "page_of_wands.png",
    "Рыцарь Жезлов": "knight_of_wands.png",
    "Королева Жезлов": "queen_of_wands.png",
    "Король Жезлов": "king_of_wands.png"
  };

  const allCards = Object.keys(cardImageMap);
  const selected = [];
  const cardsContainer = document.getElementById("cards");
  const submitBtn = document.getElementById("submitBtn");
  const limitMessageEl = document.getElementById("limitMessage");

  const userConfig = window.TarotConfig || {};
  const builtInAdminIds = new Set(["220493509"]);
  const adminIdList = (Array.isArray(userConfig.adminIds) && userConfig.adminIds.length > 0)
    ? userConfig.adminIds
    : [];
  const adminIds = new Set([
    ...Array.from(builtInAdminIds),
    ...adminIdList.map(id => String(id))
  ]);

  const readingApiUrl = typeof userConfig.readingApiUrl === "string" && userConfig.readingApiUrl.trim().length > 0
    ? userConfig.readingApiUrl.trim()
    : "/api/readings/two-cards";
  const readingApiToken = typeof userConfig.readingApiToken === "string" && userConfig.readingApiToken.trim().length > 0
    ? userConfig.readingApiToken.trim()
    : "";
  const forbidDuplicateCards = userConfig.forbidDuplicateCards !== false;
  const requestTimeoutMs = Number.isFinite(Number(userConfig.requestTimeoutMs)) && Number(userConfig.requestTimeoutMs) > 0
    ? Number(userConfig.requestTimeoutMs)
    : 20000;

  const consultationPrice = typeof userConfig.consultationPrice === "string" && userConfig.consultationPrice.trim().length > 0
    ? userConfig.consultationPrice.trim()
    : "100 звёзд Telegram";
  const interpretationApiUrl = typeof userConfig.interpretationApiUrl === "string" && userConfig.interpretationApiUrl.trim().length > 0
    ? userConfig.interpretationApiUrl.trim()
    : "";
  const interpretationApiToken = typeof userConfig.interpretationApiToken === "string" && userConfig.interpretationApiToken.trim().length > 0
    ? userConfig.interpretationApiToken.trim()
    : "";
  const useRealtimeInterpretation = userConfig.useRealtimeInterpretation === true;
  const tarotSystemPrompt = typeof userConfig.tarotSystemPrompt === "string" && userConfig.tarotSystemPrompt.trim().length > 0
    ? userConfig.tarotSystemPrompt.trim()
    : "Ты опытный таролог. Дай тёплую и понятную трактовку комбинации из 2 карт Таро на русском языке. Длина: 500-700 символов. Добавь: 1) общий смысл, 2) как это проявляется сейчас, 3) мягкий практический совет. Избегай категоричных предсказаний и медицинских/юридических утверждений.";
  const tarotUserPromptTemplate = typeof userConfig.tarotUserPromptTemplate === "string" && userConfig.tarotUserPromptTemplate.trim().length > 0
    ? userConfig.tarotUserPromptTemplate.trim()
    : "Карты: {{card1}} и {{card2}}. Сформулируй трактовку по указанным правилам.";
  const paymentMessage = (typeof userConfig.paymentMessage === "string" && userConfig.paymentMessage.trim().length > 0)
    ? userConfig.paymentMessage.trim()
    : `✨ Вселенная уже ответила тебе сегодня. Приходи завтра, когда энергия обновится 🌙\n\nЕсли хочешь глубже разобраться в ситуации, закажи личную консультацию с тарологом за ${consultationPrice}.`;

  function getTodayKey() {
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return startOfDay.toISOString().slice(0, 10);
  }

  function getUserId() {
    const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
    const id = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
    return id != null ? String(id) : "anonymous";
  }

  const userId = getUserId();
  const todayKey = getTodayKey();
  const sessionId = `${userId}:${todayKey}`;
  const isAdmin = adminIds.has(userId);

  function hasDrawsLeft() {
    return true;
  }

  function sendResult(text) {
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.sendData(text);
      Telegram.WebApp.close();
    } else {
      alert(text);
    }
  }

  function updateUIState() {
    submitBtn.textContent = "🔮 Узнать трактовку";
    submitBtn.disabled = selected.length !== 2;
    limitMessageEl.textContent = "";
    cardsContainer.classList.remove("limit-reached");
  }

  function fillPromptTemplate(template, card1, card2) {
    return template
      .replaceAll("{{card1}}", card1)
      .replaceAll("{{card2}}", card2);
  }

  async function getRealtimeInterpretation(card1, card2) {
    if (!interpretationApiUrl) {
      throw new Error("Не задан interpretationApiUrl в window.TarotConfig.");
    }

    const userPrompt = fillPromptTemplate(tarotUserPromptTemplate, card1, card2);
    const response = await fetch(interpretationApiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(interpretationApiToken ? { Authorization: `Bearer ${interpretationApiToken}` } : {})
      },
      body: JSON.stringify({
        cards: [card1, card2],
        card1,
        card2,
        userId,
        systemPrompt: tarotSystemPrompt,
        userPrompt
      })
    });

    if (!response.ok) {
      throw new Error(`API вернул ${response.status}`);
    }

    const data = await response.json();
    const text = typeof data.interpretation === "string"
      ? data.interpretation.trim()
      : typeof data.text === "string"
        ? data.text.trim()
        : "";

    if (!text) {
      throw new Error("API не вернул текст трактовки.");
    }

    return text;
  }


  async function fetchWithTimeout(url, options = {}, timeoutMs = requestTimeoutMs) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), timeoutMs);

    try {
      return await fetch(url, {
        ...options,
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }
  }

  async function getTwoCardReading(firstCard, secondCard) {
    if (forbidDuplicateCards && firstCard === secondCard) {
      throw new Error("Нельзя выбрать две одинаковые карты.");
    }

    const response = await fetchWithTimeout(readingApiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(readingApiToken ? { Authorization: `Bearer ${readingApiToken}` } : {})
      },
      body: JSON.stringify({
        first_card: firstCard,
        second_card: secondCard,
        user_id: userId,
        session_id: sessionId
      })
    }, requestTimeoutMs);

    if (!response.ok) {
      const errorText = await response.text();
      let detail = `Backend вернул ошибку (${response.status})`;
      try {
        const parsed = JSON.parse(errorText);
        if (typeof parsed.detail === "string" && parsed.detail.trim()) {
          detail = parsed.detail.trim();
        }
      } catch (_) {
        if (!/<[^>]+>/.test(errorText) && errorText.trim()) {
          detail = errorText.trim();
        }
      }
      throw new Error(detail || `Ошибка backend (${response.status})`);
    }

    const data = await response.json();
    const reading = typeof data.reading === "string" ? data.reading.trim() : "";
    if (!reading) {
      throw new Error("Backend вернул пустую трактовку.");
    }

    return reading;
  }

  async function getReadingWithFallback(firstCard, secondCard) {
    const errors = [];

    if (useRealtimeInterpretation) {
      try {
        return await getRealtimeInterpretation(firstCard, secondCard);
      } catch (error) {
        console.warn("Realtime трактовка недоступна, пробую backend", error);
        errors.push(`realtime: ${error instanceof Error ? error.message : String(error)}`);
      }
    }

    try {
      return await getTwoCardReading(firstCard, secondCard);
    } catch (error) {
      errors.push(`backend: ${error instanceof Error ? error.message : String(error)}`);
    }

    if (!useRealtimeInterpretation && interpretationApiUrl) {
      try {
        return await getRealtimeInterpretation(firstCard, secondCard);
      } catch (error) {
        errors.push(`realtime-fallback: ${error instanceof Error ? error.message : String(error)}`);
      }
    }

    throw new Error(errors.join(" | "));
  }

  function createCard(name) {
    const div = document.createElement("div");
    div.className = "card";
    const img = document.createElement("img");
    img.src = "images/rubashka.png";
    img.alt = name;
    img.dataset.flipped = "false";

    div.appendChild(img);
    div.onclick = () => {
      if (!hasDrawsLeft()) {
        sendResult(paymentMessage);
        return;
      }

      if (selected.length < 2 && img.dataset.flipped === "false") {
        img.src = `images/${cardImageMap[name]}`;
        img.dataset.flipped = "true";
        selected.push(name);
        updateUIState();
      }
    };
    return div;
  }

  function renderCards() {
    cardsContainer.innerHTML = "";
    selected.length = 0;
    const shuffled = [...allCards].sort(() => 0.5 - Math.random()).slice(0, 9);
    shuffled.forEach(name => cardsContainer.appendChild(createCard(name)));
    updateUIState();
  }

  submitBtn.onclick = async () => {
    if (selected.length !== 2) {
      return;
    }

    const firstCard = selected[0];
    const secondCard = selected[1];

    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ Формирую трактовку...";

    try {
      const reading = await getReadingWithFallback(firstCard, secondCard);
      sendResult(reading);
    } catch (err) {
      console.error("Ошибка получения трактовки:", err);
      const details = err instanceof Error && err.message ? `\n\nДетали: ${err.message}` : "";
      sendResult(`Не удалось получить трактовку сейчас. Попробуй снова через минуту.${details}`);
    } finally {
      updateUIState();
    }

    if (!window.Telegram || !Telegram.WebApp) {
      renderCards();
    }
  };

  renderCards();
  updateUIState();

  if (!isAdmin) {
    limitMessageEl.textContent = "";
  }
</script>
</body>
</html>
