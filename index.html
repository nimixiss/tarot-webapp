<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбор карт</title>
  <style>
    body {
      background-color: #1e1e2f;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .intro { max-width: 460px; margin: 0 auto 16px; line-height: 1.5; color: #d0c4df; }
    .question-label { display: block; max-width: 460px; margin: 0 auto 8px; text-align: left; font-size: 14px; }
    .question-label span { opacity: 0.65; font-size: 12px; }
    textarea { display: block; box-sizing: border-box; width: 100%; max-width: 460px; margin: 0 auto 20px; padding: 14px; color: #fff; background: #292a40; border: 1px solid #565473; border-radius: 12px; font: inherit; resize: vertical; }
    textarea:focus { outline: 2px solid #b79be4; outline-offset: 1px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(80px, 1fr));
      gap: 10px;
      justify-content: center;
    }
    .cards.limit-reached .card {
      opacity: 0.4;
      cursor: default;
    }
    .card {
      width: 100%;
      aspect-ratio: 100 / 175;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #8e44ad;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    .limit-message {
      margin-top: 16px;
      line-height: 1.5;
      white-space: pre-line;
      color: #d0c4ff;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: repeat(3, minmax(60px, 1fr));
      }
      button {
        padding: 8px 16px;
        font-size: 14px;
      }
    }

    @media (max-width: 400px) {
      .cards {
        grid-template-columns: repeat(3, minmax(50px, 1fr));
      }
      button {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
<h1>✨ Выбери 2 карты</h1>
<p class="intro">Сформулируй вопрос, затем открой две карты. Ответ придёт в чат с ботом.</p>
<label class="question-label" for="question">Твой вопрос <span>(необязательно)</span></label>
<textarea id="question" maxlength="350" rows="3" placeholder="Например: Что мне важно понять об этой ситуации?"></textarea>
<div class="cards" id="cards"></div>
<button id="submitBtn" disabled>🔮 Получить трактовку</button>
<p id="limitMessage" class="limit-message"></p>

<script>
  const cardImageMap = {
    "Шут (0)": "fool.png",
    "Маг (I)": "magician.png",
    "Верховная Жрица (II)": "high_priestess.png",
    "Императрица (III)": "empress.png",
    "Император (IV)": "emperor.png",
    "Иерофант (V)": "hierophant.png",
    "Влюблённые (VI)": "lovers.png",
    "Колесница (VII)": "chariot.png",
    "Сила (VIII)": "strength.png",
    "Отшельник (IX)": "hermit.png",
    "Колесо Фортуны (X)": "wheel_of_fortune.png",
    "Справедливость (XI)": "justice.png",
    "Повешенный (XII)": "hanged_man.png",
    "Смерть (XIII)": "death.png",
    "Умеренность (XIV)": "temperance.png",
    "Дьявол (XV)": "devil.png",
    "Башня (XVI)": "tower.png",
    "Звезда (XVII)": "star.png",
    "Луна (XVIII)": "moon.png",
    "Солнце (XIX)": "sun.png",
    "Суд (XX)": "judgement.png",
    "Мир (XXI)": "world.png",
    "Туз Кубков": "ace_of_cups.png",
    "Двойка Кубков": "two_of_cups.png",
    "Тройка Кубков": "three_of_cups.png",
    "Четвёрка Кубков": "four_of_cups.png",
    "Пятёрка Кубков": "five_of_cups.png",
    "Шестёрка Кубков": "six_of_cups.png",
    "Семёрка Кубков": "seven_of_cups.png",
    "Восьмёрка Кубков": "eight_of_cups.png",
    "Девятка Кубков": "nine_of_cups.png",
    "Десятка Кубков": "ten_of_cups.png",
    "Паж Кубков": "page_of_cups.png",
    "Рыцарь Кубков": "knight_of_cups.png",
    "Королева Кубков": "queen_of_cups.png",
    "Король Кубков": "king_of_cups.png",
    "Туз Мечей": "ace_of_swords.png",
    "Двойка Мечей": "two_of_swords.png",
    "Тройка Мечей": "three_of_swords.png",
    "Четвёрка Мечей": "four_of_swords.png",
    "Пятёрка Мечей": "five_of_swords.png",
    "Шестёрка Мечей": "six_of_swords.png",
    "Семёрка Мечей": "seven_of_swords.png",
    "Восьмёрка Мечей": "eight_of_swords.png",
    "Девятка Мечей": "nine_of_swords.png",
    "Десятка Мечей": "ten_of_swords.png",
    "Паж Мечей": "page_of_swords.png",
    "Рыцарь Мечей": "knight_of_swords.png",
    "Королева Мечей": "queen_of_swords.png",
    "Король Мечей": "king_of_swords.png",
    "Туз Пентаклей": "ace_of_pentacles.png",
    "Двойка Пентаклей": "two_of_pentacles.png",
    "Тройка Пентаклей": "three_of_pentacles.png",
    "Четвёрка Пентаклей": "four_of_pentacles.png",
    "Пятёрка Пентаклей": "five_of_pentacles.png",
    "Шестёрка Пентаклей": "six_of_pentacles.png",
    "Семёрка Пентаклей": "seven_of_pentacles.png",
    "Восьмёрка Пентаклей": "eight_of_pentacles.png",
    "Девятка Пентаклей": "nine_of_pentacles.png",
    "Десятка Пентаклей": "ten_of_pentacles.png",
    "Паж Пентаклей": "page_of_pentacles.png",
    "Рыцарь Пентаклей": "knight_of_pentacles.png",
    "Королева Пентаклей": "queen_of_pentacles.png",
    "Король Пентаклей": "king_of_pentacles.png",
    "Туз Жезлов": "ace_of_wands.png",
    "Двойка Жезлов": "two_of_wands.png",
    "Тройка Жезлов": "three_of_wands.png",
    "Четвёрка Жезлов": "four_of_wands.png",
    "Пятёрка Жезлов": "five_of_wands.png",
    "Шестёрка Жезлов": "six_of_wands.png",
    "Семёрка Жезлов": "seven_of_wands.png",
    "Восьмёрка Жезлов": "eight_of_wands.png",
    "Девятка Жезлов": "nine_of_wands.png",
    "Десятка Жезлов": "ten_of_wands.png",
    "Паж Жезлов": "page_of_wands.png",
    "Рыцарь Жезлов": "knight_of_wands.png",
    "Королева Жезлов": "queen_of_wands.png",
    "Король Жезлов": "king_of_wands.png"
  };

  const allCards = Object.keys(cardImageMap);
  const selected = [];
  const cardsContainer = document.getElementById("cards");
  const submitBtn = document.getElementById("submitBtn");
  const limitMessageEl = document.getElementById("limitMessage");

  const questionInput = document.getElementById("question");
  const tg = window.Telegram?.WebApp ?? null;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  function updateUIState() {
    submitBtn.textContent = "🔮 Получить трактовку";
    submitBtn.disabled = selected.length !== 2;
    limitMessageEl.textContent = "";
  }

  function sendResult(payload) {
    if (!tg) {
      limitMessageEl.textContent = "Открой этот расклад через кнопку в Telegram-боте.";
      return false;
    }
    // The bot owns the OpenAI request. No API secrets or model calls in the browser.
    tg.sendData(JSON.stringify(payload));
    tg.close();
    return true;
  }

  function createCard(name) {
    const div = document.createElement("div");
    div.className = "card";
    const img = document.createElement("img");
    img.src = "images/rubashka.png";
    img.alt = name;
    img.dataset.flipped = "false";

    div.appendChild(img);
    div.onclick = () => {
      if (selected.length < 2 && img.dataset.flipped === "false") {
        img.src = `images/${cardImageMap[name]}`;
        img.dataset.flipped = "true";
        selected.push(name);
        updateUIState();
      }
    };
    return div;
  }

  function renderCards() {
    cardsContainer.innerHTML = "";
    selected.length = 0;
    const shuffled = [...allCards].sort(() => 0.5 - Math.random()).slice(0, 9);
    shuffled.forEach(name => cardsContainer.appendChild(createCard(name)));
    updateUIState();
  }

  submitBtn.onclick = () => {
    if (selected.length !== 2) return;

    const question = questionInput.value.trim().replace(/\\s+/g, " ").slice(0, 350);
    const ok = sendResult({
      v: 1,
      card1: selected[0],
      card2: selected[1],
      question
    });
    if (ok) {
      submitBtn.disabled = true;
      submitBtn.textContent = "Отправлено в бот";
    }
  };

  renderCards();
  updateUIState();

  if (!isAdmin) {
    limitMessageEl.textContent = "";
  }
</script>
</body>
</html>
